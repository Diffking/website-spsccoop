name = "survey-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# โดเมนลิงก์แบบประเมิน — Custom Domain: Cloudflare สร้างระเบียน DNS + ใบรับรองให้เองตอน deploy
# (ห้ามมีระเบียน survey ค้างอยู่ก่อน ไม่งั้น deploy ไม่ผ่าน)
routes = [{ pattern = "survey.spsccoop.org", custom_domain = true }]

[vars]
ORIGIN = "https://spsccoop.org"

[[d1_databases]]
binding = "DB"
database_name = "survey-edge"
# สร้าง 27 ต.ค. 2569 (`npx wrangler d1 create survey-edge --location apac`) · ไม่ใช่ความลับ
database_id = "a7502a8d-14cf-4755-bcf5-065be4733504"

# QUEUE_TOKEN กับ PUBLIC_KEY เป็น secret — ตั้งด้วย `npx wrangler secret put` (ค่าจากหลังบ้าน → แบบประเมิน)
