# web-coopsmile — เว็บสหกรณ์ออมทรัพย์สาธารณสุขสงขลา
# Next.js ตัวเดียวจบ (หน้าบ้าน + หลังบ้าน + API) + PostgreSQL · ออกเน็ตผ่าน Cloudflare Tunnel
name: webcoopsmile

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coopsmile
      POSTGRES_PASSWORD: coopsmile
      POSTGRES_DB: coopsmile
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # เปิดออกมาให้รัน prisma migrate จากเครื่องได้ (5432/5433/5434 ถูกใช้แล้ว)
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopsmile"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ฐานข้อมูลสำหรับพัฒนาบนเครื่อง (npm run dev + prisma CLI) — คนละก้อนกับ db ของเว็บจริง
  # เครื่องนี้เสิร์ฟโดเมนจริงแล้ว ถ้า dev ใช้ db เดียวกันจะเผลอลบข้อมูลจริงหรือ
  # migrate dev พังคาเว็บจริงได้ · DATABASE_URL ใน .env ชี้มาที่ 5436 นี้
  db-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coopsmile
      POSTGRES_PASSWORD: coopsmile
      POSTGRES_DB: coopsmile
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopsmile"]
      interval: 5s
      timeout: 3s
      retries: 10

  # อัปเดตโครงตารางให้ตรง schema แล้วจบไป (รันซ้ำได้ ไม่มีอะไรเสีย)
  # ใช้ image ขั้น build เพราะมี prisma CLI ครบ ส่วน image ที่รันเว็บจริงไม่ต้องมี
  migrate:
    build:
      context: .
      target: build
    restart: "no"
    environment:
      DATABASE_URL: postgresql://coopsmile:coopsmile@db:5432/coopsmile
    command: node node_modules/prisma/build/index.js migrate deploy
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://coopsmile:coopsmile@db:5432/coopsmile
      NODE_ENV: production
    env_file: .env
    volumes:
      # รูปที่อัปจากหลังบ้าน — เก็บนอก image ไม่งั้น build ใหม่แล้วรูปหาย
      - ./uploads:/app/public/uploads
      # หน้าภาพรวมหลังบ้านอ่านสถานะไฟล์สำรอง — อ่านอย่างเดียวพอ ไม่ให้เว็บเขียนทับได้
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: node server.js
    ports:
      # ระวังพอร์ตชนกับระบบอื่นบนเครื่องนี้:
      # 80/443=officer-nginx · 3001=fincoop-frontend · 8000/8001/8010/8012=API อื่น
      # 8020/8021=coopmeeting · 8080/8081=qgeniuscoop → ระบบนี้ใช้ 8030
      #
      # ผูกกับ 127.0.0.1 เท่านั้น — เครื่องอื่นในวงแลนต่อตรงเข้าแอปไม่ได้ ต้องผ่าน
      # Cloudflare (admin.spsccoop.org) ซึ่งปลอมหัวคำขอ cf-connecting-ip ไม่ได้
      # เดิมผูก 0.0.0.0 ใครอยู่ในวงแลนก็ยิงตรงเข้ามาพร้อมหัวคำขอปลอมได้
      #
      # cloudflared ไม่ได้ใช้พอร์ตนี้ — มันต่อผ่านชื่อ web:3000 ในเน็ตเวิร์กของ Docker
      # เครื่องนี้ยังเปิด localhost:8030 ได้เหมือนเดิมตอนโดเมนพัง
      - "127.0.0.1:8030:3000"

  # สำรองรายวัน เก็บย้อนหลัง 14 วัน → ./backups/
  #   coopsmile-YYYY-MM-DD.sql      = ฐานข้อมูล
  #   uploads-YYYY-MM-DD.tar.gz     = รูปที่อัปจากหลังบ้าน
  # ต้องสำรองรูปด้วย ไม่งั้นกู้ฐานกลับมาแล้วจะเหลือแต่ path ที่ชี้ไปไฟล์ที่ไม่มีอยู่
  # กู้คืน: docker compose exec -T db psql -U coopsmile coopsmile < backups/ไฟล์.sql
  #         tar -xzf backups/uploads-ไฟล์.tar.gz -C uploads/
  #
  # ⚠️ ต้องรอ pg_isready ก่อนเสมอ ห้ามยิง pg_dump ทันทีที่คอนเทนเนอร์สตาร์ต
  #    condition: service_healthy ไม่พอ — healthcheck ของ db ใช้ pg_isready ผ่าน
  #    unix socket ในตัวมันเอง ซึ่งผ่านก่อนที่ Postgres จะเปิดรับ TCP จริง
  #    db-backup จึงยิงเร็วไปแล้วได้ Connection refused ทุกครั้งที่บูตเครื่อง
  #    แล้วไป sleep ยาว 24 ชม. · เครื่องนี้ปิดทุกคืน มันจึงไม่เคยได้ลองใหม่เลย
  #    → ไฟล์ .sql เป็น 0 ไบต์ติดกัน 13 วัน (17–31 ส.ค. 2026) กว่าจะรู้ตัว
  #
  # ⚠️ dump ลงไฟล์ชั่วคราวก่อน สำเร็จแล้วค่อย mv ทับ — ห้าม > ทับไฟล์จริงตรง ๆ
  #    เพราะ shell truncate ไฟล์ตั้งแต่ก่อน pg_dump จะเริ่ม พลาดเมื่อไหร่ก็ได้
  #    ไฟล์เปล่าไปแทนที่ของเดิมทันที · และต้องเช็ค -s ด้วย ไม่ใช่เชื่อ exit code อย่างเดียว
  #
  # ⚠️ ล้มเหลวต้องขึ้น log ว่า FAILED — ของเดิมใช้ && เฉย ๆ พลาดแล้วเงียบสนิท
  #    ส่วน uploads สำรองผ่านทุกวัน จึงดูเหมือนงานสำรองยังทำงานอยู่ทั้งที่ฐานไม่ได้สำรองเลย
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: coopsmile
    volumes:
      - ./backups:/backups
      # อ่านอย่างเดียว — งานนี้แค่คัดลอกออก ไม่ต้องมีสิทธิ์เขียนทับรูปจริง
      - ./uploads:/uploads:ro
    entrypoint:
      - sh
      - -c
      - while true; do until pg_isready -h db -U coopsmile -q; do sleep 3; done; if pg_dump -h db -U coopsmile coopsmile > /backups/coopsmile.tmp && [ -s /backups/coopsmile.tmp ]; then mv /backups/coopsmile.tmp /backups/coopsmile-$$(date +%F).sql; echo "db backup OK $$(date)"; else rm -f /backups/coopsmile.tmp; echo "db backup FAILED $$(date)"; fi; if tar -czf /backups/uploads-$$(date +%F).tar.gz -C /uploads .; then echo "uploads backup OK $$(date)"; else echo "uploads backup FAILED $$(date)"; fi; find /backups -name 'coopsmile-*.sql' -mtime +14 -delete; find /backups -name 'uploads-*.tar.gz' -mtime +14 -delete; sleep 86400; done

  # อุ่นสำเนาหน้าเว็บบนโฮสต์ วันละ 2 ครั้ง — 09:30 กับ 15:30 เวลาไทย
  #
  # ทำจากเครื่องนี้ ไม่ใช่ cron ฝั่งโฮสต์ เพราะการอุ่นต้องดึงของจากเครื่องนี้ — เครื่องนี้
  # เท่านั้นที่รู้ว่าตัวเองเปิดอยู่ ตั้ง cron ฝั่งโฮสต์ไว้ พอเครื่องนี้ปิดมันก็ดึงไม่ได้อยู่ดี
  #
  # ของเดิมยิงทุกชั่วโมง = 24 ครั้ง/วัน ซึ่งมากเกินจำเป็นสำหรับไฟร์วอลล์โฮสต์ที่ไวมาก
  # (21 ส.ค. 2026 โดนแบนทั้งที่แตะไม่ถึงสิบครั้งทั้งวัน) · ตอนนี้ใช้ crond จริง
  # ตามเวลาที่เจ้าของเว็บกำหนด เปลี่ยนเวลาได้ที่ WARM_CRON ข้างล่าง
  #
  # ⚠️ restart แล้ว "ไม่" ยิงทันทีอีกแล้ว — มันรอถึงเวลาในตารางเท่านั้น
  #    อยากอุ่นเดี๋ยวนั้น (เช่น ก่อนปิดเครื่องเย็นศุกร์) สั่งเอง:
  #      docker compose exec mirror-warm sh /warm.sh
  #
  # ไม่ตั้ง MIRROR_PURGE_TOKEN ใน .env = ไม่ทำอะไร
  mirror-warm:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    environment:
      # ไม่ตั้ง = คอนเทนเนอร์เป็น UTC แล้ว 09:30 จะกลายเป็น 16:30 เวลาไทย
      TZ: Asia/Bangkok
      # นาที ชั่วโมง วัน เดือน วันในสัปดาห์ (เวลาไทย)
      WARM_CRON: "30 9,15 * * *"
    volumes:
      - ./scripts/warm.sh:/warm.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null 2>&1
        # ตัวนับของตัวตัดวงจรเริ่มใหม่ทุกครั้งที่ restart — ตั้งใจ เพราะ restart
        # มักแปลว่าคนเพิ่งมาแก้อะไร (เช่นเพิ่งได้ไอพีที่โฮสต์ไม่ได้แบน)
        rm -f /tmp/warm.fails /tmp/warm.skips
        # busybox crond ไม่ส่ง env ของคอนเทนเนอร์ต่อให้งานที่มันสั่ง ต้องฝากไว้เป็นไฟล์
        # เอาเฉพาะตัวที่ /warm.sh ใช้ ไม่เทรหัส FTP/LINE/OpenRouter ลงไฟล์ด้วย
        export -p | grep -E "^export (MIRROR_PURGE_TOKEN|MIRROR_WARM_URL|TZ)=" > /tmp/warm.env
        # ให้ผลลัพธ์ของงานไปโผล่ใน docker compose logs (stdout ของ PID 1)
        echo "$$WARM_CRON sh /warm.sh >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "ตั้งตารางอุ่นแคชแล้ว: $$WARM_CRON (เวลาไทย) — สั่งเองได้ที่ sh /warm.sh"
        exec crond -f -l 8

  # ดึงวันหยุดจากระบบสำนักงานในวงแลนอัตโนมัติ ทุก 6 ชม.
  # เช็คก่อนเสมอ — เหมือนเดิมก็ไม่เขียนฐาน ไม่ล้างแคช และไม่ขึ้น log อะไรเลย
  # (ดู src/lib/holidaySync.ts) · ไม่ตั้ง HOLIDAY_SYNC_TOKEN = เส้นทางปิดตาย ตัวนี้ก็ไม่ทำงาน
  #
  # เขียนเป็นบล็อก (|) ไม่ใช่บรรทัดเดียวเหมือน mirror-warm เพราะคำสั่งมี ": " อยู่
  # ซึ่ง YAML จะอ่านเป็น key: value แล้วพังทั้งไฟล์
  holiday-sync:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        # รอ web ตั้งตัวก่อน ไม่งั้นรอบแรกยิงไปตอนยังไม่พร้อมแล้วได้ error เปล่า ๆ
        sleep 30
        while true; do
          if [ -n "$$HOLIDAY_SYNC_TOKEN" ]; then
            out=$$(curl -s -m 60 -X POST -H "x-sync-token: $$HOLIDAY_SYNC_TOKEN" http://web:3000/api/holidays/sync/)
            # เหมือนเดิม = เงียบ · เปลี่ยนหรือพลาดเมื่อไหร่ค่อยขึ้น log
            case "$$out" in
              *'"added":0,"renamed":0'*) ;;
              *) echo "วันหยุด $$(date '+%F %H:%M') $$out" ;;
            esac
          fi
          sleep 21600
        done

  # Cloudflare Tunnel — ชี้โดเมนเข้า web:3000 (ตั้ง ingress ฝั่ง Cloudflare)
  # TUNNEL_TOKEN อยู่ในไฟล์ .env ข้างไฟล์นี้ (ไม่ commit)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  pgdata:
  pgdata_dev:
